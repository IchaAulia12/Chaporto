<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found — Your Name</title>
    <meta name="robots" content="noindex" />

    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/styles.css" />

    <script>
      (function () {
        document.documentElement.classList.add("js");
        try {
          var t = localStorage.getItem("theme");
          if (t) document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <header class="site-header" id="site-header">
      <div class="container header-inner">
        <a class="brand" href="index.html">Your<span>Name</span></a>

        <nav class="site-nav" id="site-nav" aria-label="Main">
          <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="work.html">Work</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="index.html#contact">Contact</a></li>
          </ul>
        </nav>

        <div class="header-actions">
          <button class="icon-button theme-toggle" type="button" data-theme-toggle aria-label="Switch to dark theme">
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4" />
            </svg>
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" />
            </svg>
          </button>

          <button class="icon-button nav-toggle" type="button" data-nav-toggle aria-expanded="false" aria-controls="site-nav" aria-label="Open menu">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <path d="M4 7h16M4 12h16M4 17h16" />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <main id="main" class="section cta" style="display: grid; place-items: center">
      <div class="container cta__inner">
        <p class="eyebrow">Error 404</p>
        <h1>This page doesn't exist</h1>
        <p class="lead" style="margin-inline: auto; margin-top: var(--space-sm)">
          The link may be broken, or the page may have moved. Nothing you did
          wrong.
        </p>
        <div class="hero__actions" style="margin-top: var(--space-lg)">
          <a class="button button--primary" href="index.html">Back to homepage</a>
          <a class="button button--secondary" href="work.html">Browse my work</a>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <p>&copy; <span data-current-year>2026</span> Your Name. All rights reserved.</p>
      </div>
    </footer>

    <script src="js/main.js" defer></script>
  </body>
</html>
